http:
  # Must be a full socket address; do not omit the host part
  addr: "0.0.0.0:18080"
  cors_origins: ["http://localhost:5173", "http://localhost:5273"]

postgres:
  # App connects as ignition_app (not table owner) so RLS policies apply.
  # Connecting as postgres superuser bypasses RLS and tenant isolation is void.
  # Override with IGNITION_PG_DSN to keep passwords out of version control.
  # Real connection string lives in configs/local.env (IGNITION_PG_DSN overrides this).
  dsn: "postgres://ignition_app:ignition_app@localhost:55432/ignition?sslmode=disable"
  max_connections: 10
  schema: "ignition"

attribution:
  # Matches docs/product/attribution-policy-v1.md. Changes require a new version and customer notice.
  policy_version: "v1"
