http:
  # Must be a full socket address; do not omit the host part
  addr: "0.0.0.0:8080"
  # TMA frontend is a separately deployed static site, cross-origin from the API — allow explicitly.
  # Use an allow list, not "*": these endpoints carry Bearer tokens. Empty disables CORS.
  cors_origins:
    - "http://localhost:5173"

postgres:
  # App must connect as a non-privileged role without BYPASSRLS or RLS policies do not apply.
  #
  # Hosted DB default postgres (e.g. Supabase) has BYPASSRLS — tenant isolation (constraint C5)
  # fails silently. Startup checks warn but do not fix it. Production must use a dedicated role.
  #
  # Use Session Pooler (5432), not Transaction Pooler (6543): the latter drops session state,
  # breaking sqlx prepared statements and search_path.
  #
  # Override with IGNITION_PG_DSN to keep the connection string out of version control.
  dsn: "postgres://ignition_app:ignition_app@localhost:55432/ignition?sslmode=disable"
  max_connections: 10
  # Dedicated schema, isolated from other projects on a shared DB (e.g. growing_tales).
  # Prepended to search_path on each connection. Override with IGNITION_PG_SCHEMA.
  schema: "ignition"

attribution:
  # Matches docs/product/attribution-policy-v1.md. Changes require a new version and customer notice.
  policy_version: "v1"

# Secret material (bot tokens, API key secrets) is encrypted at rest. The master key and JWT key
# come from environment variables only (IGNITION_MASTER_KEY / IGNITION_JWT_KEY) — never config.
#
# Envelope encryption (optional). Omit this block for V1 direct master-key mode (the default).
# When present, new _enc writes are V2 envelope blobs (per-secret data key wrapped by a KMS);
# existing V1 blobs stay readable, so switching needs no re-encryption downtime.
# secrets:
#   kms:
#     # local: credential-free, derives a KEK from the master key — for local runs and CI.
#     # aws:   real KMS; a deploy-time adapter (implement secrets::KeyProvider) — not in this binary.
#     provider: local
#     # key_id: "arn:aws:kms:...:key/..."   # required by real backends; unused by local

# Payment gateway for `job push-invoices` (sends finalized invoices to the provider).
# Omit for the default `log` gateway — no external calls, runs the whole push path locally.
# payments:
#   # log:    credential-free stand-in (local / CI).
#   # stripe: real gateway; a deploy-time adapter (implement payments::PaymentGateway) — not in this binary.
#   provider: log
#   # api_key_env: STRIPE_SECRET_KEY   # env var the real adapter reads; unused by log
