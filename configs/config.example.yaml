http:
  # 必须是完整的 socket 地址，不能省略主机部分
  addr: "0.0.0.0:8080"

postgres:
  # 应用以 linksprout_app 角色连接（非表 owner），RLS 策略才会生效。
  # 用 postgres 超级用户连接会绕过 RLS，租户隔离形同虚设。
  # 可用环境变量 LINKSPROUT_PG_DSN 覆盖，避免密码进版本库。
  dsn: "postgres://linksprout_app:linksprout_app@localhost:55432/linksprout"
  max_connections: 10

attribution:
  # 对应 docs/attribution-policy-v1.md。变更需发新版本号并提前通知客户。
  policy_version: "v1"
